<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>근력학교 이화 — 훈련일지 작성</title>
<style>
  /* ── FONT FACES ── */

  /* ── RESET & VARIABLES ── */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --purple-700: #3B2650;
    --purple-600: #4B2D5E;
    --purple-500: #5E3D74;
    --purple-400: #7B5A93;
    --purple-300: #9E82B0;
    --purple-200: #C4B0D2;
    --purple-100: #E8DFF0;
    --purple-50:  #F5F0F8;

    --rose-400: #D4829A;
    --rose-300: #E4A5B8;
    --rose-200: #F0C6D4;
    --rose-100: #F9E4EC;
    --rose-50:  #FDF5F8;

    --bg-gradient-1: #EDE0F5;
    --bg-gradient-2: #F9DDE8;
    --bg-gradient-3: #E6DAF2;
    --bg-card: rgba(255, 255, 255, 0.72);
    --bg-card-solid: #fff;
    --border-subtle: rgba(196, 176, 210, 0.3);

    --text-primary: #2E1A3E;
    --text-secondary: #6B5A7E;
    --text-muted: #A89AB8;

    --success: #5BB88A;
    --warning: #E8A854;
    --danger: #D94E6A;
    --journal: #3D6B3A;
    --journal-light: rgba(61, 107, 58, 0.08);

    --aux-color: #6B8E7B;
    --aux-bg: rgba(107, 142, 123, 0.08);
    --aux-border: rgba(107, 142, 123, 0.18);
    --main-color: var(--purple-500);
    --main-bg: rgba(94, 61, 116, 0.06);
    --main-border: rgba(94, 61, 116, 0.14);

    --font-display: 'TYPE졸업식', sans-serif;
    --font-body: 'CarmenSans', 'Noto Sans KR', sans-serif;

    --nav-height: 68px;
  }

  html { font-size: 16px; }

  body {
    font-family: var(--font-body);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    background: var(--bg-gradient-1);
    color: var(--text-primary);
    padding-bottom: calc(var(--nav-height) + 80px);
  }

  /* ── GRADIENT BACKGROUND ── */
  .bg-atmosphere {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 90% 70% at 10% 5%, rgba(190, 160, 220, 0.6) 0%, transparent 65%),
      radial-gradient(ellipse 80% 60% at 90% 10%, rgba(240, 170, 200, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 75% 85%, rgba(180, 150, 220, 0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 15% 85%, rgba(235, 180, 205, 0.45) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 70%),
      linear-gradient(150deg, #EDE0F5 0%, #F9DDE8 35%, #E6DAF2 65%, #F5E4EE 100%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.018;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 100;
  }

  /* ── MAIN CONTENT ── */
  .main {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 1.25rem 2rem;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
  }

  /* ── PAGE HEADER ── */
  .page-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 0 1.25rem;
    animation: fadeDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    text-decoration: none;
  }

  .back-btn:hover {
    border-color: var(--purple-200);
    color: var(--purple-500);
  }

  .back-btn svg {
    width: 20px;
    height: 20px;
  }

  .page-header__title {
    font-family: var(--font-display);
    font-size: 1.25rem;
    color: var(--text-primary);
  }

  /* ── DATE/WEEK HEADER CARD ── */
  .meta-card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 1rem 1.125rem;
    margin-bottom: 1rem;
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
  }

  .meta-card__row {
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }

  .meta-card__row + .meta-card__row {
    margin-top: 0.625rem;
  }

  .meta-card__label {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--text-muted);
    width: 48px;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }

  .meta-card__date-input {
    flex: 1;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: rgba(245, 240, 248, 0.5);
    padding: 0 0.75rem;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .meta-card__date-input:focus {
    border-color: var(--purple-300);
  }

  .meta-card__week-group {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    flex: 1;
  }

  .meta-card__week-badge {
    height: 32px;
    padding: 0 0.875rem;
    border-radius: 8px;
    background: rgba(94, 61, 116, 0.08);
    border: 1px solid rgba(94, 61, 116, 0.12);
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--purple-500);
    display: flex;
    align-items: center;
  }

  .meta-card__week-input {
    width: 44px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: rgba(245, 240, 248, 0.5);
    text-align: center;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }

  .meta-card__week-input:focus {
    border-color: var(--purple-300);
  }

  .meta-card__week-suffix {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .meta-card__focus-input {
    flex: 1;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: rgba(245, 240, 248, 0.5);
    padding: 0 0.75rem;
    font-family: var(--font-body);
    font-size: 0.75rem;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }

  .meta-card__focus-input::placeholder {
    color: var(--text-muted);
    font-size: 0.6875rem;
  }

  .meta-card__focus-input:focus {
    border-color: var(--purple-300);
  }

  /* ── SECTION ── */
  .section {
    margin-bottom: 1rem;
  }

  .section__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }

  .section__title-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section__marker {
    width: 4px;
    height: 18px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .section__marker--aux {
    background: linear-gradient(180deg, var(--aux-color), rgba(107, 142, 123, 0.4));
  }

  .section__marker--main {
    background: linear-gradient(180deg, var(--purple-500), rgba(94, 61, 116, 0.4));
  }

  .section__title {
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--text-primary);
  }

  .section__count {
    font-size: 0.625rem;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(168, 154, 184, 0.12);
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
  }

  /* ── EXERCISE CARD ── */
  .ex-card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 0.875rem 1rem;
    margin-bottom: 0.5rem;
    position: relative;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    animation: scaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .ex-card--aux {
    border-left: 3px solid var(--aux-border);
  }

  .ex-card--main {
    border-left: 3px solid var(--main-border);
  }

  .ex-card__top {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.625rem;
  }

  .ex-card__num {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    font-size: 0.6875rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .ex-card__num--aux {
    background: var(--aux-bg);
    color: var(--aux-color);
  }

  .ex-card__num--main {
    background: var(--main-bg);
    color: var(--main-color);
  }

  .ex-card__name-input {
    flex: 1;
    height: 32px;
    border: none;
    border-bottom: 1.5px solid rgba(196, 176, 210, 0.25);
    background: transparent;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
    padding: 0 0.25rem;
  }

  .ex-card__name-input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
  }

  .ex-card__name-input:focus {
    border-bottom-color: var(--purple-300);
  }

  .ex-card__remove {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    opacity: 0.5;
  }

  .ex-card__remove:hover {
    background: rgba(217, 78, 106, 0.08);
    color: var(--danger);
    opacity: 1;
  }

  .ex-card__remove svg {
    width: 14px;
    height: 14px;
  }

  /* ── COACH FEEDBACK (per-exercise) ── */
  .ex-card__coach {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px dashed rgba(196, 176, 210, 0.2);
  }

  .ex-card__coach-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--rose-400);
    opacity: 0.7;
  }

  .ex-card__coach-input {
    flex: 1;
    height: 28px;
    border: none;
    border-bottom: 1px solid rgba(212, 130, 154, 0.2);
    background: transparent;
    font-family: var(--font-body);
    font-size: 0.6875rem;
    color: var(--text-secondary);
    outline: none;
    transition: border-color 0.2s;
    padding: 0 0.25rem;
  }

  .ex-card__coach-input::placeholder {
    color: var(--text-muted);
    font-size: 0.625rem;
    font-style: italic;
  }

  .ex-card__coach-input:focus {
    border-bottom-color: var(--rose-300);
  }

  /* ── SET ROWS ── */
  .sets-area {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .set-header {
    display: grid;
    grid-template-columns: 32px 1fr 68px 68px 26px;
    gap: 0.375rem;
    padding: 0 0.125rem 0.25rem;
    font-size: 0.5625rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .set-header span:first-child {
    text-align: center;
  }

  .set-row-input {
    display: grid;
    grid-template-columns: 32px 1fr 68px 68px 26px;
    gap: 0.375rem;
    align-items: center;
    padding: 0.125rem;
    border-radius: 8px;
    transition: background 0.15s;
  }

  .set-row-input:nth-child(even) {
    background: rgba(245, 240, 248, 0.3);
  }

  .set-row-input__num {
    font-size: 0.6875rem;
    font-weight: 700;
    text-align: center;
    color: var(--text-muted);
  }

  .set-row-input__field {
    height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(196, 176, 210, 0.2);
    background: rgba(245, 240, 248, 0.4);
    padding: 0 0.5rem;
    font-family: var(--font-body);
    font-size: 0.75rem;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .set-row-input__field:focus {
    border-color: var(--purple-300);
    background: rgba(245, 240, 248, 0.7);
  }

  .set-row-input__field::placeholder {
    color: var(--text-muted);
    font-size: 0.6875rem;
  }

  .set-row-input__field--weight {
    text-align: center;
    font-weight: 600;
  }

  .set-row-input__field--reps {
    text-align: center;
    font-weight: 600;
  }

  .set-row-input__remove {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.35;
    transition: all 0.15s;
  }

  .set-row-input__remove:hover {
    opacity: 1;
    background: rgba(217, 78, 106, 0.08);
    color: var(--danger);
  }

  .set-row-input__remove svg {
    width: 12px;
    height: 12px;
  }

  /* ── ADD SET BUTTON ── */
  .add-set-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    margin-top: 0.375rem;
    padding: 0.375rem;
    border: 1px dashed rgba(196, 176, 210, 0.3);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.2s;
    width: 100%;
  }

  .add-set-btn:hover {
    border-color: var(--purple-300);
    color: var(--purple-400);
    background: rgba(94, 61, 116, 0.03);
  }

  .add-set-btn svg {
    width: 14px;
    height: 14px;
  }

  /* ── ADD EXERCISE BUTTON ── */
  .add-ex-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    width: 100%;
    padding: 0.75rem;
    border-radius: 12px;
    border: 1.5px dashed;
    background: transparent;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 600;
    transition: all 0.25s;
    margin-bottom: 0.5rem;
  }

  .add-ex-btn--aux {
    border-color: var(--aux-border);
    color: var(--aux-color);
  }

  .add-ex-btn--aux:hover {
    background: rgba(107, 142, 123, 0.06);
    border-color: var(--aux-color);
  }

  .add-ex-btn--main {
    border-color: var(--main-border);
    color: var(--main-color);
  }

  .add-ex-btn--main:hover {
    background: rgba(94, 61, 116, 0.04);
    border-color: var(--purple-400);
  }

  .add-ex-btn svg {
    width: 16px;
    height: 16px;
  }

  /* ── NOTES SECTION ── */
  .notes-card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 1rem 1.125rem;
    margin-bottom: 0.75rem;
    animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
  }

  .notes-card__label {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
  }

  .notes-card__label svg {
    width: 14px;
    height: 14px;
    opacity: 0.7;
  }

  .notes-card__textarea {
    width: 100%;
    min-height: 60px;
    border: 1px solid rgba(196, 176, 210, 0.2);
    border-radius: 10px;
    background: rgba(245, 240, 248, 0.4);
    padding: 0.625rem 0.75rem;
    font-family: var(--font-body);
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--text-primary);
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }

  .notes-card__textarea::placeholder {
    color: var(--text-muted);
  }

  .notes-card__textarea:focus {
    border-color: var(--purple-300);
    background: rgba(245, 240, 248, 0.6);
  }

  /* ── FEELING SECTION ── */
  .feeling-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.625rem;
  }

  .feeling-row__label {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .feeling-row__options {
    display: flex;
    gap: 0.375rem;
    flex: 1;
  }

  .feeling-btn {
    flex: 1;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(196, 176, 210, 0.25);
    background: rgba(245, 240, 248, 0.3);
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .feeling-btn:hover {
    border-color: var(--purple-200);
    background: rgba(245, 240, 248, 0.6);
  }

  .feeling-btn.active {
    border-color: var(--purple-400);
    background: rgba(94, 61, 116, 0.1);
    transform: scale(1.08);
    box-shadow: 0 2px 8px rgba(94, 61, 116, 0.12);
  }

  /* ── SUBMIT AREA ── */
  .submit-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-subtle);
    padding: 0.75rem 1.25rem calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
  }

  .submit-area__inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    gap: 0.625rem;
  }

  .btn-draft {
    flex: 1;
    height: 46px;
    border-radius: 12px;
    border: 1.5px solid var(--border-subtle);
    background: var(--bg-card);
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-draft:hover {
    border-color: var(--purple-200);
    color: var(--purple-500);
  }

  .btn-submit {
    flex: 2;
    height: 46px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--purple-500), var(--purple-400));
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(94, 61, 116, 0.25);
    letter-spacing: 0.02em;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(94, 61, 116, 0.3);
  }

  .btn-submit:active {
    transform: scale(0.97);
  }

  /* ── SAVED TOAST ── */
  .toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    z-index: 200;
    background: rgba(61, 107, 58, 0.95);
    backdrop-filter: blur(12px);
    color: #fff;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 0.75rem 1.25rem;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(61, 107, 58, 0.3);
    display: flex;
    align-items: center;
    gap: 0.5rem;

// ── Auto-calculate Week ──
function calcWeek() {
  // Program start date (mock: 2026-02-23, Monday of week 1)
  var programStart = new Date('2026-02-23');
  var dateInput = document.querySelector('.meta-card__date-input');
  var today = dateInput ? new Date(dateInput.value) : new Date();
  var diff = today - programStart;
  var weekNum = Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) + 1;
  if (weekNum < 1) weekNum = 1;
  if (weekNum > 52) weekNum = 52;
  var badge = document.getElementById('week-badge');
  if (badge) badge.textContent = weekNum + '주차';
  return weekNum;
}

  document.getElementById('main-count').textContent = mainN + '개';
}

// ── Feeling Select ──
function selectFeeling(btn) {
  var btns = btn.parentElement.querySelectorAll('.feeling-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
  }
  btn.classList.add('active');
}

// ── Toast ──
function showToast(msg) {
  var toast = document.getElementById('toast');
  if (msg) toast.lastChild.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() {
    toast.classList.remove('show');
  }, 2200);
}

// ── Save ──
function saveDraft() {
  showToast('임시저장 되었습니다');
}

function submitJournal() {
  var btn = document.querySelector('.btn-submit');
  btn.textContent = '저장됨';
  btn.style.background = 'linear-gradient(135deg, #3D6B3A, #5BB88A)';
  showToast('저장되었습니다');
  setTimeout(function() {
    btn.textContent = '저장하기';
    btn.style.background = '';
  }, 2000);
}

// ── Create Exercise Card from Program Data ──
function createProgramExercise(type, exData, num) {
  var prev = prevWeights[exData.name];
  var hasPrev = prev && prev.length > 0;
  var isAux = type === 'aux';

  var card = document.createElement('div');
  card.className = 'ex-card ex-card--' + type;
  card.style.animation = 'scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) ' + (num * 0.05) + 's both';

  // Build sets HTML
  var setsHtml = '<div class="set-header">' +
    '<span>세트</span><span>메모</span>' +
    '<span>중량' + (hasPrev ? ' <span class="set-header__hint">지난</span>' : '') + '</span>' +
    '<span>횟수</span><span></span></div>';

  for (var s = 0; s < exData.setsCount; s++) {
    var prevW = (prev && prev[s]) ? prev[s] : '';
    var weightPH = prevW || (isAux ? '—' : 'kg');
    var prevClass = prevW ? ' has-prev' : '';
    var notePH = (s === 0 && exData.note) ? exData.note : '';

    setsHtml += '<div class="set-row-input">' +
      '<span class="set-row-input__num">' + (s + 1) + '</span>' +
      '<input type="text" class="set-row-input__field" placeholder="' + notePH + '">' +
      '<input type="text" class="set-row-input__field set-row-input__field--weight' + prevClass + '" placeholder="' + weightPH + '">' +
      '<input type="text" class="set-row-input__field set-row-input__field--reps" placeholder="횟수" value="' + exData.reps + '">' +
      '<button class="set-row-input__remove" onclick="removeSet(this)">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
      '</button></div>';
  }

  card.innerHTML =
    '<div class="ex-card__top">' +
      '<span class="ex-card__num ex-card__num--' + type + '">' + num + '</span>' +
      '<input type="text" class="ex-card__name-input" value="' + exData.name + '" placeholder="운동 이름">' +
      '<button class="ex-card__remove" onclick="removeExercise(this)" aria-label="삭제">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</button>' +
    '</div>' +
    '<div class="sets-area">' + setsHtml + '</div>' +
    '<button class="add-set-btn" onclick="addSet(this)">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
      '세트 추가' +
    '</button>' +
    '<div class="ex-card__coach">' +
      '<svg class="ex-card__coach-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
      '<input type="text" class="ex-card__coach-input" placeholder="코치 피드백 (예: 허리 붙이기, 날개뼈 모으기)">' +
    '</div>';

  return card;
}

// ── Load Day from Program ──
// ── Load Free Training (empty template) ──
function loadFreeTraining() {
  isFreeTraining = true;
  currentDay = -1;

  // Clear focus
  document.getElementById('focus-input').value = '';
  document.getElementById('focus-input').placeholder = '자유 훈련 포커스 (예: 상체 보충, 유산소)';

  // Update pills - deactivate all, activate free pill
  var pills = document.querySelectorAll('.day-pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].classList.remove('active');
  }
  var freePill = document.querySelector('.day-pill--free');
  if (freePill) freePill.classList.add('active');

  // Hide program banner, show manual week/day inputs
  document.getElementById('program-banner').style.display = 'none';
  document.getElementById('week-auto').style.display = 'none';
  document.getElementById('week-manual').style.display = 'flex';

  // Clear exercises (only add buttons remain)
  document.getElementById('aux-exercises').innerHTML = '';
  document.getElementById('main-exercises').innerHTML = '';

  updateCounts();
}

function loadDay(dayIndex) {
  isFreeTraining = false;
  currentDay = dayIndex;
  var day = programData.days[dayIndex];

  // Update focus field
  document.getElementById('focus-input').value = day.focus;
  document.getElementById('focus-input').placeholder = '오늘의 훈련 포커스 (예: 피봇 week, 케틀벨 스킬)';

  // Update day pills active state (including free pill)
  var pills = document.querySelectorAll('.day-pill');
  for (var i = 0; i < pills.length; i++) {
    if (pills[i].classList.contains('day-pill--free')) {
      pills[i].classList.remove('active');
    } else if (parseInt(pills[i].getAttribute('data-day')) === dayIndex) {
      pills[i].classList.add('active');
    } else {
      pills[i].classList.remove('active');
    }
  }

  // Show program banner, show auto week badge
  document.getElementById('program-banner').style.display = 'flex';
  document.getElementById('week-auto').style.display = 'flex';
  document.getElementById('week-manual').style.display = 'none';
  document.getElementById('program-name').textContent = programData.name;

  // Generate aux exercises
  var auxContainer = document.getElementById('aux-exercises');
  auxContainer.innerHTML = '';
  for (var a = 0; a < day.aux.length; a++) {
    auxContainer.appendChild(createProgramExercise('aux', day.aux[a], a + 1));
  }

  // Generate main exercises
  var mainContainer = document.getElementById('main-exercises');
  mainContainer.innerHTML = '';
  for (var m = 0; m < day.main.length; m++) {
    mainContainer.appendChild(createProgramExercise('main', day.main[m], m + 1));
  }

  updateCounts();
}

// ── Initialize Page ──
function initPage() {
  // Create day pills
  var pillsContainer = document.getElementById('day-pills');
  for (var i = 0; i < programData.days.length; i++) {
    (function(idx) {
      var day = programData.days[idx];
      var btn = document.createElement('button');
      btn.className = 'day-pill' + (idx === 0 ? ' active' : '');
      btn.setAttribute('data-day', idx);
      btn.innerHTML = day.label + '<span class="day-pill__sub">' + day.title + '</span>';
      btn.onclick = function() { loadDay(idx); };
      pillsContainer.appendChild(btn);
    })(i);
  }

  // Add free training pill
  var freeBtn = document.createElement('button');
  freeBtn.className = 'day-pill day-pill--free';
  freeBtn.innerHTML = '자유<span class="day-pill__sub">개인 훈련</span>';
  freeBtn.onclick = function() { loadFreeTraining(); };
  pillsContainer.appendChild(freeBtn);

  // Auto-calculate week number
  calcWeek();

  // Re-calc week when date changes
  var dateInput = document.querySelector('.meta-card__date-input');
  if (dateInput) {
    dateInput.addEventListener('change', calcWeek);
  }

  // Load first day
  loadDay(0);
}

document.addEventListener('DOMContentLoaded', initPage);
</script>
